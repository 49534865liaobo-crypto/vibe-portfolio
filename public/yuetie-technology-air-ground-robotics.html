        padding: 0 10px;
        text-align: center;

        content: ">";

        top: 11px;
        right: -6px;
        color: var(--cyan);
        font-size: 22px;
        font-weight: 900;

        font-size: 12.5px;

        display: block;
        margin-top: 4px;

        .hero .wrap {
          grid-template-columns: 1fr;
          text-align: center;
        }

        .hero-panel {

        .nav-row {
          align-items: flex-start;
        }

        .nlogo {
          width: 100%;
          margin-bottom: 4px;
        }

        .nav-links {
          width: 100%;
          overflow-x: auto;
          flex-wrap: nowrap;
          padding-bottom: 4px;
        }

        .lang-switch {
          margin-top: 4px;
        }

        .grid-4,
        .grid-3,
        .scenes,
        .stats .wrap {
          grid-template-columns: 1fr;
        }

        .cat-head {
          align-items: flex-start;
        }

        .cat-count {
          margin-left: 0;
        }

        .lstep:not(:last-child)::after {
          display: none;
        }

      }

      @media print {
        * {
          -webkit-print-color-adjust: exact;

        }

        nav {
          display: none !important;

        section {
          padding: 22px 0;
        }

        .scene,
        .tech-card,
        .concept-card,
        .platform-card,
        .lstep,
        .cat-head {
          break-inside: avoid;
        }
      }

      function setText(id, value) {
        const node = document.getElementById(id);
        if (node) node.textContent = value;
      }

      function setHtml(id, value) {
        const node = document.getElementById(id);
        if (node) node.innerHTML = value;
      }

      function setMeta(attribute, key, value) {
        if (!value) return;
        let node = document.head.querySelector(`meta[${attribute}="${key}"]`);
        if (!node) {
          node = document.createElement("meta");
          node.setAttribute(attribute, key);
          document.head.appendChild(node);
        }
        node.setAttribute("content", value);
      }

      function setLink(selector, attrs) {
        let node = document.head.querySelector(selector);
        if (!node) {
          node = document.createElement("link");
          document.head.appendChild(node);
        }
        Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
      }

      function card(items, className, renderItem) {
        return items.map((item) => `<div class="${className}">${renderItem(item)}</div>`).join("");
      }

      function icon(name) {
        return `<i data-lucide="${name}" aria-hidden="true"></i>`;
      }

      function refreshIcons() {
        if (window.lucide) {
          window.lucide.createIcons({
            attrs: {
              "stroke-width": 1.8
            }
          });
        }
      }

        setText("navLogo", t.navLogo);
        document.getElementById("navLinks").innerHTML = t.nav
          .map(([href, label]) => `<a href="#${href}">${label}</a>`)
          .join("");

        setText("heroEyebrow", t.heroEyebrow);
        setHtml("heroTitle", t.heroTitle);
        setText("heroCopy", t.heroCopy);
        document.getElementById("heroTags").innerHTML = t.tags.map((tag) => `<span>${tag}</span>`).join("");
        document.getElementById("heroImage").alt = t.heroImageAlt;
        setText("heroVisualKicker", t.heroVisualKicker);
        setText("heroVisualTitle", t.heroVisualTitle);
        setText("heroVisualText", t.heroVisualText);
        document.getElementById("heroVisualTags").innerHTML = t.heroVisualTags
          .map((tag) => `<span>${tag}</span>`)
          .join("");

        document.getElementById("statsGrid").innerHTML = t.stats
          .map(([number, label]) => `<div class="stat"><div class="n">${number}</div><div class="l">${label}</div></div>`)
          .join("");

        setText("ideaK", t.ideaK);
        setText("ideaTitle", t.ideaTitle);
        setText("ideaText", t.ideaText);
        document.getElementById("conceptGrid").innerHTML = card(t.concepts, "concept-card", ([icon, title, text]) =>
          `<div class="icon">${window.icon(icon)}</div><h3>${title}</h3><p>${text}</p>`
        );
        setText("ideaLine", t.ideaLine);

        setText("techK", t.techK);
        setText("techTitle", t.techTitle);
        setText("techText", t.techText);
        document.getElementById("techGrid").innerHTML = card(t.techs, "tech-card", ([icon, title, text]) =>
          `<div class="icon">${window.icon(icon)}</div><h3>${title}</h3><p>${text}</p>`
        );

        setText("airK", t.airK);
        setText("airTitle", t.airTitle);
        setText("airBoxTitle", t.airBoxTitle);
        setText("airBoxText", t.airBoxText);
        document.getElementById("platformGrid").innerHTML = card(t.platforms, "platform-card", ([icon, title, text]) =>
          `<div class="platform-visual">${window.icon(icon)}</div><div class="copy"><b>${title}</b><p>${text}</p></div>`
        );

        setText("scenarioK", t.scenarioK);
        setText("scenarioTitle", t.scenarioTitle);
        document.getElementById("legend").innerHTML = t.legend
          .map(([status, label, text]) => `<span><span class="badge ${statusClass[status]}">${label}</span> ${text}</span>`)
          .join("");

        document.getElementById("scenarioSections").innerHTML = t.categories
          .map((category) => {
            const cards = category.scenarios
              .map(
                ([icon, name, status, pain, solution, value]) => `
                  <div class="scene" data-status="${status}">
                    <div class="s-head">
                      <span class="s-ico">${window.icon(icon)}</span>
                      <span class="s-name">${name}</span>
                      <span class="badge ${statusClass[status]}">${t.legend.find((item) => item[0] === status)[1]}</span>
                    </div>
                    <div class="s-row"><span class="s-k">${t.labels.pain}</span><span class="s-v">${pain}</span></div>
                    <div class="s-row"><span class="s-k">${t.labels.solution}</span><span class="s-v">${solution}</span></div>
                    <div class="s-row value"><span class="s-k">${t.labels.value}</span><span class="s-v">${value}</span></div>
                  </div>
                `
              )
              .join("");

            return `
              <section class="category" id="${category.id}">
                <div class="wrap">
                  <div class="cat-head">
                    <span class="cat-ico">${window.icon(category.icon)}</span>
                    <div><h2>${category.title}</h2><p>${category.desc}</p></div>
                    <span class="cat-count">${category.scenarios.length} ${t.labels.count}</span>
                  </div>
                  <div class="scenes">${cards}</div>
                </div>
              </section>
            `;
          })
          .join("");

        setText("loopK", t.loopK);
        setText("loopTitle", t.loopTitle);
        setText("loopText", t.loopText);
        document.getElementById("loopSteps").innerHTML = t.loop
          .map(([icon, title, text]) => `<div class="lstep"><div class="li">${window.icon(icon)}</div><h4>${title}</h4><p>${text}</p></div>`)
          .join("");

        setText("footerTitle", t.footerTitle);
        setText("footerIdea", t.footerIdea);
        setText("footerTeam", t.footerTeam);
        setText("footerNote", t.footerNote);

        document.querySelectorAll("[data-lang]").forEach((button) => {
          button.classList.toggle("active", button.dataset.lang === lang);
          button.setAttribute("aria-pressed", String(button.dataset.lang === lang));
        });
        localStorage.setItem("yuetieLang", lang);
        refreshIcons();
      }

      window.icon = icon;

      document.querySelectorAll("[data-lang]").forEach((button) => {
        button.addEventListener("click", () => render(button.dataset.lang));
      });

      const params = new URLSearchParams(window.location.search);
      const requested = params.get("lang");
      const saved = localStorage.getItem("yuetieLang");
      const browserLang = navigator.language && navigator.language.toLowerCase().startsWith("zh") ? "zh" : "en";
      render(requested === "zh" || requested === "en" ? requested : saved || browserLang);
    </script>
  </body>
</html>
